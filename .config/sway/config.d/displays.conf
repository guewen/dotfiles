output "DP-1" {	
    mode 3840x2160@30.000Hz
    pos 0 0
    transform normal
    scale 1.125
    scale_filter linear
    dpms on
    adaptive_sync off
}
output "eDP-1" {	  
    mode 3840x2160@59.997Hz
    pos 0 1920
    transform normal
    scale 2
    scale_filter nearest
    adaptive_sync off
    dpms on
}
